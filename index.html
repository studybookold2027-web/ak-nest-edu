<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6FB;--ink:#1B1F3B;--mute:#586081;--card:#fff;--line:#E1E4F0;--pri:#3B3FD8;--priink:#fff;--acc:#FF9F1C;--ok:#1E8E5A;--bad:#D14343;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1126;--ink:#EEF0FF;--mute:#A3AACB;--card:#171B38;--line:#272C52;--pri:#8C95FF;--priink:#0E1126;--acc:#FFB547;--ok:#4CC38A;--bad:#FF8080;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1126;--ink:#EEF0FF;--mute:#A3AACB;--card:#171B38;--line:#272C52;--pri:#8C95FF;--priink:#0E1126;--acc:#FFB547;--ok:#4CC38A;--bad:#FF8080;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Hind,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
/* ---- Sidebar navigation (desktop) / drawer (mobile) ---- */
html.nolock{overflow:hidden}
.side{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:86vw;z-index:40;display:flex;flex-direction:column;background:linear-gradient(180deg,#1B1D6B 0%,#2B2DA8 58%,#4A34C6 100%);color:#E8EAFF;overflow:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transform:translateX(-102%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;box-shadow:6px 0 24px rgba(10,12,40,.35)}
.side.open{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.sbrand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 14px 12px 16px;border-bottom:1px solid rgba(255,255,255,.14)}
.logo{display:flex;align-items:center;gap:10px;font:800 1.18rem/1.1 "Baloo 2",Hind,sans-serif;color:var(--pri);text-decoration:none}
.logo .lg{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#5B3FD8,#2E2FB8);color:#fff;font:800 1.08rem/1 "Baloo 2",Hind,system-ui,sans-serif;letter-spacing:.02em;flex:none}
.side .logo{color:#fff}.side .logo .lg{background:rgba(255,255,255,.18)}
.sclose{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;width:36px;height:36px;font-size:1.1rem;cursor:pointer;flex:none}
#nav{flex:1;min-height:0;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:6px 10px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.ngw.last{margin-top:auto;position:sticky;bottom:0;background:#4A34C6;border-top:1px solid rgba(255,255,255,.16);padding-bottom:2px}
.ng{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:#B9BEFA;font-weight:600;padding:11px 12px 3px}
#nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;margin:1px 0;border-radius:10px;color:#E8EAFF;text-decoration:none;font-weight:500;line-height:1.3;white-space:normal;overflow-wrap:anywhere}
#nav a:hover{background:rgba(255,255,255,.12)}
#nav a[aria-current="page"]{background:rgba(255,255,255,.22);color:#fff;font-weight:600;box-shadow:inset 4px 0 0 var(--acc)}
#nav a:focus-visible,.sclose:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.ni{width:26px;flex:none;text-align:center;font-size:1.2rem}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line);padding:9px 14px}
#mbtn{background:none;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:1.3rem;line-height:1;cursor:pointer;flex:none}
#scrim{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,12,40,.55);z-index:35}
#scrim[hidden]{display:none}
.authbrand{text-align:center;margin:6px 0 18px}
.authbrand .lg{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#5B3FD8,#2E2FB8);color:#fff;font:800 1.6rem/1 "Baloo 2",Hind,system-ui,sans-serif;letter-spacing:.02em;margin-bottom:8px}
.authbrand h1{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:800;color:var(--pri)}
.authbrand .tl{font-weight:600;color:var(--acc);letter-spacing:.05em;margin-top:2px}
.authbrand p{margin:4px 0 0;color:var(--mute)}
body.authonly .side,body.authonly .mtop,body.authonly footer,body.authonly #scrim{display:none!important}
body.authonly .mainwrap{margin-left:0}
body.authonly main{max-width:480px;padding-top:36px}
body.authonly #app .card{margin-left:auto;margin-right:auto;max-width:none!important}
/* ---- festival animation: ONE full-screen fixed canvas (visual only, no sound) ---- */
#fx{position:fixed;top:0;left:0;width:100%;height:100%;z-index:45;pointer-events:none;display:none;background:transparent}
html.fx-on #fx{display:block}
/* ---- festival banner (home page) and festival glow: only used while a festival is active ---- */
.fb{position:relative;overflow:hidden;text-align:center;color:#fff;background:linear-gradient(135deg,var(--b1) 0%,var(--b2) 55%,var(--b3) 100%);border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:24px 46px;margin:0 0 20px;box-shadow:0 6px 22px rgba(20,20,80,.28);animation:fbpulse 3.4s ease-in-out infinite}
.fb.tri::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,#FF9933 0 33.4%,#FFFFFF 33.4% 66.6%,#138808 66.6% 100%)}
.ft{position:relative;z-index:1}
.fhi{display:inline-block;max-width:100%;font:800 clamp(1.9rem,7vw,3.4rem)/1.25 "Baloo 2",Hind,system-ui,sans-serif;letter-spacing:.01em;text-wrap:balance;color:var(--ac);background:linear-gradient(100deg,#FFFFFF 0%,var(--ac) 30%,#FFFFFF 55%,var(--ac) 80%,#FFFFFF 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px var(--ac));animation:shim 5s linear infinite}
.fen{font:700 clamp(1.3rem,4.6vw,2.2rem)/1.25 "Baloo 2",Hind,system-ui,sans-serif;color:#fff;text-shadow:0 0 12px var(--ac),0 1px 2px rgba(0,0,0,.35);text-wrap:balance}
.fn{position:relative;z-index:1;margin-top:6px;font-weight:600;opacity:.95;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.fo{position:relative;z-index:1;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center}
.fo span{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.34);border-radius:99px;padding:3px 12px;font-size:.9rem;font-weight:600}
.fi i{position:absolute;left:var(--x);top:var(--y);font-style:normal;font-size:clamp(1.2rem,3.6vw,2.1rem);line-height:1;animation:ffloat 3.4s ease-in-out infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 0 6px var(--ac));pointer-events:none}
.fb .sp{position:absolute;left:var(--x);top:var(--y);width:1em;height:1em;font-size:var(--s,16px);line-height:1;color:var(--c,#FFE08A);pointer-events:none;opacity:0;animation:twinkle var(--t,2.6s) ease-in-out infinite;animation-delay:var(--d,0s)}
.fb .sp::before{content:"\2726";position:absolute;left:0;top:0;text-shadow:0 0 8px currentColor}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0deg)}45%{opacity:1;transform:scale(1.15) rotate(70deg)}70%{opacity:.7;transform:scale(.8) rotate(130deg)}}
@keyframes shim{0%{background-position:0 0}100%{background-position:200% 0}}
@keyframes ffloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
@keyframes fbpulse{0%,100%{box-shadow:0 6px 22px rgba(20,20,80,.28),0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 6px 26px rgba(20,20,80,.35),0 0 22px var(--ac)}}
@keyframes fglow{0%,100%{filter:drop-shadow(0 0 2px var(--fa,#FFC84A));transform:scale(1)}50%{filter:drop-shadow(0 0 7px var(--fa,#FFC84A)) drop-shadow(0 0 14px var(--fa,#FFC84A));transform:scale(1.14)}}
@keyframes lgglow{0%,100%{box-shadow:0 0 0 2px var(--fa,#FFC84A),0 0 10px var(--fa,#FFC84A)}50%{box-shadow:0 0 0 2px var(--fa,#FFC84A),0 0 24px var(--fa,#FFC84A)}}
html.fest .ni{animation:fglow 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
html.fest .lg{animation:lgglow 2.8s ease-in-out infinite}
html.fest .card .ic{animation:fglow 3.2s ease-in-out infinite}
html.fest .hero .tag{box-shadow:0 0 16px var(--fa,#FFC84A)}
@media (max-width:600px){.fb{padding:22px 16px}}
/* ---- 90-day study planner (Routine page) ---- */
main.wide{max-width:1560px}
.pl [hidden]{display:none!important}
.plhead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 16px}
.plhead h2{margin-bottom:4px}
.plst{display:inline-block;font-size:.88rem;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mute)}
.plst.ok{color:var(--ok);border-color:var(--ok)}.plst.warn{color:#B26A00;border-color:#E0A030}.plst.bad{color:var(--bad);border-color:var(--bad)}
.plcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 12px}
.plc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:10px;padding:10px 12px}
.plc b{display:block;font-size:1.45rem;line-height:1.2}.plc span{color:var(--mute);font-size:.82rem}
.plc.ok{border-left-color:var(--ok)}.plc.bad{border-left-color:var(--bad)}
.plprog{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.plprog small{color:var(--mute)}
.plbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.plbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3B3FD8,#7B3FD8,#B0185A);transition:width .3s}
.plbar i.ok,.plchart i.ok{background:linear-gradient(90deg,#1E8E5A,#4CC38A)}
.pltool{margin-bottom:12px}
.plbtns{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin-top:8px}
.plext{display:inline-flex;align-items:center;gap:6px;margin:4px 6px 4px 0}.plext input{width:80px}
.plfil{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.plfil input[type=search]{flex:2 1 240px;width:auto}.plfil select{flex:1 1 140px;width:auto}
.plfd{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;color:var(--mute)}.plfd input{width:auto}
.plwrap{overflow:auto;max-height:72vh;border:2px solid var(--tb,#B8BEDD);border-radius:10px;background:var(--card)}
.pltb{border-collapse:separate;border-spacing:0;min-width:1720px;width:100%}
.pltb th{position:sticky;top:0;z-index:2;background:var(--hc);color:#fff;font-weight:700;font-size:.86rem;padding:10px 8px;border-right:1px solid rgba(255,255,255,.45);border-bottom:2px solid rgba(0,0,0,.25);white-space:nowrap;text-align:center}
.pltb td{border-right:1px solid var(--tb,#C9CEE6);border-bottom:1px solid var(--tb,#C9CEE6);padding:0;vertical-align:middle;background:var(--card)}
.pltb tbody tr:nth-child(even) td{background:rgba(59,63,216,.045)}
.pltb tr.sp td{background:rgba(30,142,90,.14)}.pltb tr.sa td{background:rgba(209,67,67,.14)}
.pltb tr.st td{box-shadow:inset 0 2px 0 var(--acc),inset 0 -2px 0 var(--acc)}
.pltb tr.flash td{animation:plflash 1.3s ease}
@keyframes plflash{0%,60%{background:rgba(255,159,28,.4)}100%{}}
.pltb td.n{text-align:center;color:var(--mute);font-weight:700;width:46px;padding:0 6px}
.pltb td.ck{text-align:center}.pltb td.ck input{width:20px;height:20px;margin:0;accent-color:var(--pri);cursor:pointer}
.pltb input:not([type=checkbox]),.pltb textarea{border:0;border-radius:0;background:transparent;padding:7px 8px;min-height:0;width:100%;resize:vertical}
.pltb textarea{min-height:36px;resize:none;field-sizing:content;max-height:140px}
.pltb input:focus,.pltb textarea:focus{outline:2px solid var(--pri);outline-offset:-2px;background:var(--card)}
.pltb td.act{white-space:nowrap;text-align:center;padding:0 4px}
.rb{background:transparent;border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:1rem;padding:3px 8px;margin:2px;color:inherit}.rb:hover{background:var(--line)}
.pltb .empty td{text-align:center;padding:24px;color:var(--mute)}
.plfoot{margin:8px 0 16px;color:var(--mute);font-size:.9rem}
.plsl{display:grid;gap:8px;margin-bottom:10px}.plsi{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.plsi input{flex:1 1 200px;width:auto}.plsi small{color:var(--mute)}
.plscroll{overflow:auto;margin-bottom:8px}.plrt{border-collapse:collapse;min-width:520px}.plrt th{background:var(--pri);color:var(--priink);padding:7px 10px;text-align:left}.plrt td{border:1px solid var(--line);padding:6px 10px}
#plrep h4{margin:14px 0 6px}
.plchart{display:flex;align-items:flex-end;gap:6px;height:120px;overflow-x:auto;padding:4px 0}
.plcb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:34px}.plcb i{display:block;width:22px;min-height:3px;border-radius:4px 4px 0 0;background:var(--pri)}.plcb i.bad{background:var(--bad)}.plcb small{font-size:.68rem;color:var(--mute);margin-top:3px}
@media (prefers-color-scheme:dark){.plwrap{--tb:#3A4070}.pltb td{--tb:#3A4070}.plst.warn{color:#FFB547}}
@media (max-width:760px){
  .plcards{grid-template-columns:repeat(2,1fr)}
  .plwrap{max-height:none;overflow:visible;border:0;background:transparent}
  .pltb,.pltb tbody,.pltb tr,.pltb td{display:block;min-width:0}
  .pltb thead{display:none}
  .pltb tr{border:2px solid var(--tb,#B8BEDD);border-radius:12px;margin:0 0 14px;overflow:hidden;background:var(--card)}
  .pltb td,.pltb tbody tr:nth-child(even) td{display:flex;align-items:center;gap:8px;border:0;border-bottom:1px solid var(--line);padding:5px 8px;background:transparent}
  .pltb tr.sp{background:rgba(30,142,90,.13)}.pltb tr.sa{background:rgba(209,67,67,.13)}
  .pltb tr.sp td,.pltb tr.sa td{background:transparent}
  .pltb td::before{content:attr(data-l);flex:0 0 108px;font-weight:700;font-size:.74rem;color:#fff;background:var(--hc);padding:5px 6px;border-radius:6px;text-align:center}
  .pltb td.n{width:auto;justify-content:flex-start;font-weight:800}.pltb td.n::before{content:"Row No."}
  .pltb tr.st{border-color:var(--acc)}.pltb tr.st td{box-shadow:none}
  .pltb td.ck{justify-content:flex-start}
  .pltb td.act{justify-content:flex-end}.pltb td.act::before{display:none}
  .pltb input:not([type=checkbox]),.pltb textarea{flex:1;border:1px solid var(--line);border-radius:7px;background:var(--bg);min-width:0}
  .pltb textarea{min-height:56px;field-sizing:content}
  .plfd{flex:1 1 140px}
}
/* ---- Typing Practice: sentence (left) and typing box (right), always side by side ---- */
.tpg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch;margin:12px 0}
.tpp{display:flex;flex-direction:column;min-width:0;background:var(--card);border:2px solid var(--tb,#B8BEDD);border-radius:14px;overflow:hidden;box-shadow:0 3px 14px rgba(46,47,184,.10)}
.tpp>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;color:#fff;font-weight:700;font-size:.95rem;background:linear-gradient(135deg,#3B3FD8,#6A3FD8)}
.tpr>header{background:linear-gradient(135deg,#00838F,#1E8E5A)}
.tpp>header small{font-weight:600;opacity:.95;white-space:nowrap;background:rgba(255,255,255,.2);border-radius:99px;padding:2px 9px}
.tpb{position:relative;flex:1;overflow:auto;padding:12px;min-height:200px;max-height:min(62vh,460px)}
.tpin{min-width:132px;height:100%;display:flex;flex-direction:column}
.tpg .sample{margin:0;border:0;padding:0;background:transparent;font-size:clamp(1.05rem,2.3vw,1.55rem);line-height:1.9;overflow-wrap:anywhere}
.tpg .sample .ok{color:var(--ok);background:rgba(30,142,90,.14);border-radius:3px}
.tpg .sample .bad{color:var(--bad);background:rgba(209,67,67,.3);border-radius:3px;text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.tpg .sample .cur{border-bottom:3px solid var(--acc);background:rgba(255,159,28,.2);animation:tpblink 1s steps(2) infinite}
@keyframes tpblink{50%{border-bottom-color:transparent}}
.tpg textarea{flex:1;min-height:170px;height:100%;width:100%;resize:none;font-size:max(16px,clamp(1.05rem,2.3vw,1.5rem));line-height:1.7;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.tpg textarea:focus{outline:3px solid var(--pri);outline-offset:1px}
@media (max-width:700px){
  .tpg{gap:8px}
  .tpp{border-radius:11px;border-width:1.5px}
  .tpp>header{padding:7px 8px;font-size:.78rem}.tpp>header small{padding:1px 6px;font-size:.72rem}
  .tpb{padding:8px;min-height:230px}
  .tpg .sample{font-size:1.02rem;line-height:1.75}
  .tpg textarea{font-size:16px;min-height:200px;padding:8px}
}
@media (max-height:820px){#nav a{padding:6px 12px}.ng{padding:8px 12px 2px}.sbrand{padding-top:12px;padding-bottom:10px}}
@media (min-width:900px){
  .side{transform:none;visibility:visible;max-width:none;box-shadow:none;transition:none}
  .mainwrap{margin-left:272px}
  .mtop,.sclose,#scrim{display:none!important}
}
main{max-width:1000px;margin:0 auto;padding:24px 16px 56px}
h1,h2,h3{font-family:"Baloo 2",Hind,sans-serif;line-height:1.2;margin:0 0 8px}
h2{font-size:1.7rem;font-weight:800}h3{font-size:1.15rem;font-weight:600}
.lead{color:var(--mute);margin:0 0 20px}
.hero{background:linear-gradient(135deg,#2E2FB8,#5B3FD8);color:#fff;border-radius:16px;padding:40px 24px;margin-bottom:24px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;color:#fff}
.hero p{margin:6px 0;max-width:560px;color:#E6E7FF}
.tag{display:inline-block;background:#FF9F1C;color:#1B1F3B;font-weight:600;border-radius:99px;padding:2px 14px;margin-bottom:12px}
.btn{display:inline-block;background:var(--pri);color:var(--priink);border:0;border-radius:8px;padding:10px 18px;font:600 1rem Hind,sans-serif;text-decoration:none;cursor:pointer;margin:4px 6px 4px 0}
.btn.alt{background:transparent;color:inherit;border:1.5px solid currentColor}
.hero .btn{background:#FF9F1C;color:#1B1F3B}.hero .btn.alt{background:transparent;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;color:inherit;text-decoration:none;display:block}
a.card:hover{border-color:var(--pri)}
.card .ic{font-size:1.8rem}
.card p{margin:4px 0 0;color:var(--mute);font-size:.95rem}
.card ul{margin:6px 0 0;padding-left:20px;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:.9rem;color:var(--mute);margin:10px 0 3px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 140px}
.big{font:800 3rem/1 "Baloo 2",sans-serif;text-align:center;margin:6px 0}
.sample{font-size:1.3rem;line-height:2;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:12px 0}

.opt.right{border-color:var(--ok);background:rgba(30,142,90,.14)}.opt.wrong{border-color:var(--bad);background:rgba(209,67,67,.14)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--acc)}
.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--pri)}
.task.d .t{text-decoration:line-through;color:var(--mute)}.task .t{flex:1}
.x{background:none;border:0;color:var(--mute);font-size:1.2rem;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-top:1px solid var(--line)}th{color:var(--mute);font-weight:500}
.seg button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 16px;font:inherit;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--priink);border-color:var(--pri)}

.clock .lbl{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#DBEAFE}
.clock .hms{display:flex;justify-content:center;gap:8px;align-items:flex-end;margin:10px 0;flex-wrap:wrap}
.clock .u{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;min-width:72px}
.clock .u b{display:block;font:800 clamp(2rem,9vw,3.6rem)/1.05 "Baloo 2",sans-serif;font-variant-numeric:tabular-nums}
.clock .u small{color:#DBEAFE;font-size:.75rem}
.clock .ap{font:600 1.1rem "Baloo 2",sans-serif;background:#fff;color:#1E40AF;border-radius:8px;padding:2px 10px;margin-bottom:10px}

.sbar div{flex:1;text-align:center;font-size:.72rem;color:var(--mute)}
.sbar i{display:block;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wd{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 12px;margin:3px;cursor:pointer;color:var(--ink);font-size:.95rem}

#toasts{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;z-index:50;padding:0 12px;pointer-events:none}

footer{text-align:center;color:var(--mute);padding:20px;font-size:.9rem}
.msg{color:var(--mute);min-height:1.5em}

function wdOf(day){return new Date(day+'T00:00:00Z').getUTCDay();}
function occurs(r,day){
  if(day<r.start_date)return false;
  if(r.recurrence==='daily')return true;
  if(r.recurrence==='weekly'){
    if(r.weekdays&&r.weekdays.length)return r.weekdays.indexOf(wdOf(day))>=0;
    return wdOf(day)===wdOf(r.start_date);
  }
  return r.start_date===day;
}

async function rDone(a,b){

    var r=await sb.from('routine_done').select('routine_id,day').gte('day',a).lte('day',b);
    if(r.error)throw new Error(r.error.message);

  }else{
    var d=ldone();
    Object.keys(d).forEach(function(k){var day=k.split('|')[1];if(day>=a&&day<=b)m[k]=1;});

}

async function remTick(){

    if(!f||typeof f!=='object'||Array.isArray(f))f={};
    RC.L.forEach(function(r){
      if(r.remind_min==null||!r.start_time||!occurs(r,day)||RC.D[r.id+'|'+day])return;
      var st=toMin(r.start_time),k=r.id+'|'+day+'|'+r.remind_min;

var IDLE_MS=600000,WARN_MS=540000,IK='sba.lastActive',NK='sba.idleNote',idleTimer=null,idleBox=null,idleMem=Date.now(),idleW=0;
function idleLast(){try{var v=parseInt(localStorage.getItem(IK),10);if(v>0)return v;}catch(e){}return idleMem;}
function idleMark(){var n=Date.now();idleMem=n;idleW=n;try{localStorage.setItem(IK,String(n));}catch(e){}}
function idleActivity(){
  if(!me)return;
  var n=Date.now();
  if(n-idleLast()>=WARN_MS)return;   /* warning is open: only the Continue Session button counts */
  if(n-idleW<1000)return;            /* write at most once a second */
  idleMark();
}
['mousemove','mousedown','keydown','scroll','touchstart','click','wheel'].forEach(function(ev){window.addEventListener(ev,idleActivity,{passive:true,capture:true});});
function idleHide(){if(idleBox&&idleBox.style.display!=='none')idleBox.style.display='none';}
function idleShow(sec){
  if(!idleBox){
    idleBox=document.createElement('div');

    document.body.appendChild(idleBox);
    $('idleok').onclick=function(){idleMark();idleTick();};
  }
  $('idlesec').textContent=sec;
  if(idleBox.style.display!=='flex'){idleBox.style.display='flex';$('idleok').focus();}
}
function idleLogout(){
  idleStop();
  try{localStorage.setItem(NK,String(Date.now()));}catch(e){}
  function go(){if(location.hash!=='#login')location.hash='#login';}
  if(!sb){go();return;}
  sb.auth.signOut({scope:'local'}).then(function(r){
    if(r&&r.error){ /* sign-out call failed (e.g. offline): clear the stored session and reload so nobody stays logged in */
      try{Object.keys(localStorage).forEach(function(k){if(/^sb-.*-auth-token/.test(k))localStorage.removeItem(k);});}catch(e){}
      me=null;location.hash='#login';location.reload();return;
    }
    go();
  },function(){
    try{Object.keys(localStorage).forEach(function(k){if(/^sb-.*-auth-token/.test(k))localStorage.removeItem(k);});}catch(e){}
    me=null;location.hash='#login';location.reload();
  });
}
function idleTick(){
  if(!me){idleHide();return;}
  var age=Date.now()-idleLast();
  if(age>=IDLE_MS){idleLogout();return;}
  if(age>=WARN_MS)idleShow(Math.max(1,Math.ceil((IDLE_MS-age)/1000)));else idleHide();
}
function idleStart(){idleMark();if(!idleTimer)idleTimer=setInterval(idleTick,1000);}
function idleStop(){if(idleTimer){clearInterval(idleTimer);idleTimer=null;}idleHide();}

function setUser(u){

  if(!u){UP=null;mem={};return;}

'study-room':function(){
  var secs=1500,mode=25,run=false;
  function draw(){$('clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');}
  function setM(m){mode=m;secs=m*60;run=false;$('go').textContent='Start';$('m25').setAttribute('aria-pressed',m===25);$('m5').setAttribute('aria-pressed',m===5);$('tmsg').textContent='';draw();}
  $('m25').onclick=function(){setM(25);};$('m5').onclick=function(){setM(5);};
  $('go').onclick=function(){run=!run;this.textContent=run?'Pause':'Start';};
  $('rs').onclick=function(){setM(mode);};
  timers.push(setInterval(function(){if(!run)return;secs--;if(secs<=0){secs=0;run=false;$('go').textContent='Start';$('tmsg').textContent=mode===25?'शाबाश! अब 5 मिनट का ब्रेक लें।':'ब्रेक खत्म, फिर से पढ़ाई शुरू करें।';}draw();},1000));
},
typing:function(){
  var lang='hi',tgt='',t0=0,done=false,ta=$('ta');
  function best(){var b=get('best-'+lang,null);$('best').innerHTML=b?'Best: <b>'+b.wpm+'</b> WPM':'';}
  function paint(){
    var v=ta.value,h='';
    for(var i=0;i<tgt.length;i++){var c=esc(tgt[i]);h+=i<v.length?'<span class="'+(v[i]===tgt[i]?'ok':'bad')+'">'+c+'</span>':(i===v.length?'<span class="cur">'+c+'</span>':c);}
    $('sample').innerHTML=h;
    $('tpc').textContent=Math.min(v.length,tgt.length)+' / '+tgt.length;
    var box=$('sample').closest('.tpb'),cur=$('sample').querySelector('.cur');          /* keep the letter to type in view inside the panel */
    if(box&&cur){var top=cur.offsetTop,left=cur.offsetLeft;if(top<box.scrollTop+8||top>box.scrollTop+box.clientHeight-48)box.scrollTop=Math.max(0,top-34);if(left<box.scrollLeft||left>box.scrollLeft+box.clientWidth-30)box.scrollLeft=Math.max(0,left-30);}
  }
  function newT(){var a=TXT[lang];tgt=a[Math.floor(Math.random()*a.length)];ta.value='';ta.disabled=false;t0=0;done=false;$('wpm').textContent='0';$('acc').textContent='100';paint();best();ta.placeholder=lang==='hi'?'यहाँ टाइप करना शुरू करें…':'Start typing here…';}
  ta.addEventListener('paste',function(e){e.preventDefault();});
  $('tpg').querySelector('.tpr').addEventListener('click',function(ev){if(ev.target!==ta&&!ta.disabled)ta.focus();});
  ta.addEventListener('input',function(){
    if(done)return;
    if(!t0)t0=Date.now();
    var v=ta.value,ok=0;
    for(var i=0;i<v.length;i++)if(v[i]===tgt[i])ok++;
    var m=Math.max((Date.now()-t0)/60000,1/600);
    $('wpm').textContent=Math.round(ok/5/m);
    $('acc').textContent=v.length?Math.round(ok/v.length*100):100;
    paint();
    if(v.length>=tgt.length){
      done=true;ta.disabled=true;
      var r={wpm:Math.round(ok/5/m),acc:Math.round(ok/v.length*100)},b=get('best-'+lang,null);
      if(!b||r.wpm>b.wpm)put('best-'+lang,r);
      best();
    }
  });
  function setL(l){lang=l;$('lhi').setAttribute('aria-pressed',l==='hi');$('len').setAttribute('aria-pressed',l==='en');newT();}
  $('lhi').onclick=function(){setL('hi');};$('len').onclick=function(){setL('en');};$('nw').onclick=newT;
  newT();
},
test:function(){
  QS=BANK.slice().sort(function(){return Math.random()-.5;}).slice(0,6);
  var qi=0,sc=0,box=$('qz');
  function show(){
    if(qi>=QS.length){
      var b=get('best-test',null);if(b===null||sc>b)put('best-test',sc);
      box.innerHTML='<div class="card" style="text-align:center"><div class="big">'+sc+' / '+QS.length+'</div><p>'+(sc>=5?'शानदार प्रदर्शन!':sc>=3?'अच्छा प्रयास, थोड़ा और अभ्यास करें।':'चिंता न करें, दोबारा कोशिश करें।')+'</p><button class="btn" id="rt">फिर से दें</button></div>';
      $('rt').onclick=route;return;
    }
    var q=QS[qi];
    box.innerHTML='<div class="card"><div class="prog"><i style="width:'+(qi/QS.length*100)+'%"></i></div><p class="msg">सवाल '+(qi+1)+' / '+QS.length+'</p><h3>'+q[0]+'</h3>'+q[1].map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o+'</button>';}).join('')+'</div>';
    var locked=false;
    Array.prototype.forEach.call(box.querySelectorAll('.opt'),function(b){b.onclick=function(){
      if(locked)return;locked=true;
      var i=+b.getAttribute('data-i');
      if(i===q[2])sc++;else b.classList.add('wrong');
      box.querySelectorAll('.opt')[q[2]].classList.add('right');
      var n=document.createElement('button');n.className='btn';n.textContent=qi===QS.length-1?'रिज़ल्ट देखें':'अगला सवाल';
      n.onclick=function(){qi++;show();};box.firstChild.appendChild(n);
    };});
  }
  show();
},
planner:function(){
  var T=get('tasks',[]);
  function draw(){
    var d=T.filter(function(t){return t.done;}).length;
    $('pb').style.width=(T.length?d/T.length*100:0)+'%';
    var td=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),tm=0,am=0;
    T.forEach(function(t){var a=(t.st||'').split(':'),b=(t.et||'').split(':'),m=(t.st&&t.et&&t.et>t.st)?(b[0]*60+ +b[1])-(a[0]*60+ +a[1]):0;am+=m;if(t.date===td)tm+=m;});
    $('pc').textContent=T.length?d+' / '+T.length+' रिकॉर्ड पूरे · आज: '+tm+' मिनट · कुल: '+Math.round(am/6)/10+' घंटे':'अभी कोई रिकॉर्ड नहीं है। ऊपर से पहला जोड़ें।';
    T.sort(function(a,b){return ((a.date||'9')+(a.st||'')).localeCompare((b.date||'9')+(b.st||''));});
    $('pl').innerHTML=T.map(function(t){return '<tr class="'+(t.done?'d':'')+'"><td>'+esc(t.ts||'')+'</td><td>'+esc(t.name||'')+'</td><td>'+esc(t.subj||'')+'</td><td>'+esc(t.topic||t.t||'')+'</td><td>'+esc(t.date||'')+'</td><td>'+esc(t.st||'')+'</td><td>'+esc(t.et||'')+'</td><td>'+esc(t.goal||'')+'</td><td><input type="checkbox" data-c="'+t.id+'"'+(t.done?' checked':'')+' aria-label="पूरा"></td><td><button class="x" data-x="'+t.id+'" aria-label="हटाएँ">×</button></td></tr>';}).join('');
  }
  $('pa').onclick=function(){
    var v=$('pt').value.trim(),a=$('p1').value,b=$('p2').value,m=$('pm');
    if(!v){m.textContent='पहले Topic लिखें।';return;}
    if(a&&b&&b<=a){m.textContent='End Time, Start Time के बाद का होना चाहिए।';return;}
    var n=$('pn').value.trim();put('name',n);
    T.push({id:String(Date.now()),ts:new Date().toLocaleString('en-IN'),name:n,subj:$('ps').value,topic:v,date:$('pd').value,st:a,et:b,goal:$('pg').value.trim(),done:false});
    $('pt').value='';$('pg').value='';m.textContent='रिकॉर्ड जुड़ गया।';put('tasks',T);draw();
  };
  $('pl').onclick=function(e){
    var c=e.target.getAttribute('data-c'),x=e.target.getAttribute('data-x');
    if(c){T.forEach(function(t){if(t.id===c)t.done=e.target.checked;});}
    if(x)T=T.filter(function(t){return t.id!==x;});
    if(c||x){put('tasks',T);draw();}
  };
  $('pn').value=get('name','');
  $('pd').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  draw();
},

account:function(init){
  if(!sb)return;
  var am=$('am'),mode='in';
  function say(t,ok){am.textContent=t;am.style.color=ok?'var(--ok)':'var(--bad)';}
  function done(b){if(b)b.disabled=false;}
  if($('npb')){
    $('npb').onclick=function(){
      var p=$('np').value,b=$('npb');
      if(p.length<8){say('पासवर्ड कम से कम 8 अक्षर का होना चाहिए।');return;}
      b.disabled=true;
      sb.auth.updateUser({password:p}).then(function(r){done(b);if(r.error){say(authMsg(r.error));return;}recov=false;location.hash='#dashboard';route();}).catch(function(e){done(b);say(authMsg(e));});
    };
    return;
  }
  if($('lo')){$('lo').onclick=manualLogout;return;}
  var sg=$('sg');
  var rsT=null;
  function cool(sec){
    var rb=$('rs');if(!rb)return;
    var left=sec;rb.disabled=true;rb.textContent='दोबारा भेजें ('+left+' s)';
    if(rsT)clearInterval(rsT);
    rsT=setInterval(function(){
      var x=$('rs');if(!x){clearInterval(rsT);return;}
      left--;
      if(left<=0){clearInterval(rsT);x.disabled=false;x.textContent='कोड दोबारा भेजें';}
      else x.textContent='दोबारा भेजें ('+left+' s)';
    },1000);
    timers.push(rsT);
  }
  function setMode(m){
    mode=m;
    Array.prototype.forEach.call(sg.children,function(x){x.setAttribute('aria-pressed',x.getAttribute('data-m')===m);});
    $('nmw').hidden=m!=='up';$('pww').hidden=(m==='fp'||m==='vf');$('cdw').hidden=m!=='vf';$('rsw').hidden=m!=='vf';
    $('ap').setAttribute('autocomplete',m==='up'?'new-password':'current-password');
    $('ab').textContent=m==='in'?'Login':(m==='up'?'खाता बनाएँ':(m==='vf'?'कोड जाँचें':'रीसेट लिंक भेजें'));
    say('');
  }
  $('rs').onclick=function(){
    var e=$('ae').value.trim(),b=$('rs');
    if(e.indexOf('@')<1){say('कृपया ऊपर सही ईमेल लिखें।');return;}
    b.disabled=true;
    sb.auth.resend({type:'signup',email:e,options:{emailRedirectTo:location.origin+location.pathname}}).then(function(r){
      if(r.error){b.disabled=false;say(authMsg(r.error));return;}
      say('नया कोड भेज दिया गया है। कृपया इनबॉक्स और स्पैम देखें।',true);cool(60);
    }).catch(function(x){b.disabled=false;say(authMsg(x));});
  };
  Array.prototype.forEach.call(sg.children,function(b){b.onclick=function(){setMode(b.getAttribute('data-m'));};});
  if(loginNote){say(loginNote);loginNote='';}
  try{var nt=parseInt(localStorage.getItem(NK),10);if(nt>0){localStorage.removeItem(NK);if(Date.now()-nt<1800000)say('10 मिनट निष्क्रिय रहने के कारण आपको Logout कर दिया गया। कृपया फिर से Login करें।');}}catch(e){}
  ['an','ae','ap','ac'].forEach(function(id){$(id).onkeydown=function(ev){if(ev.key==='Enter')$('ab').click();};});
  if(init==='up'||init==='fp')setMode(init);
  $('ab').onclick=function(){
    var b=$('ab'),e=$('ae').value.trim(),p=$('ap').value,n=$('an').value.trim();
    if(e.indexOf('@')<1){say('कृपया सही ईमेल लिखें।');return;}
    if(mode==='fp'){
      b.disabled=true;
      sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname}).then(function(r){done(b);if(r.error)say(authMsg(r.error));else say('अगर इस ईमेल से खाता है, तो पासवर्ड रीसेट का लिंक भेज दिया गया है। इनबॉक्स और स्पैम फ़ोल्डर देखें।',true);}).catch(function(x){done(b);say(authMsg(x));});
      return;
    }
    if(mode==='vf'){
      var cd=$('ac').value.replace(/\s+/g,'');
      if(!/^\d{6,10}$/.test(cd)){say('कृपया ईमेल में आया कोड (सिर्फ़ अंक) डालिए।');return;}
      b.disabled=true;
      sb.auth.verifyOtp({email:e,token:cd,type:'signup'}).then(function(r){
        done(b);
        if(r.error){say(authMsg(r.error));return;}
        say('ईमेल सत्यापित हो गया। आपको Dashboard पर ले जा रहे हैं…',true);
        location.hash='#dashboard';route();
      }).catch(function(x){done(b);say(authMsg(x));});
      return;
    }
    if(mode==='up'&&n.length<1){say('कृपया अपना नाम लिखें।');return;}
    if(p.length<8){say('पासवर्ड कम से कम 8 अक्षर का होना चाहिए।');return;}
    b.disabled=true;
    if(mode==='in'){
      sb.auth.signInWithPassword({email:e,password:p}).then(function(r){done(b);if(r.error){if(r.error.code==='email_not_confirmed'||/email not confirmed/i.test(r.error.message||'')){setMode('vf');say('आपका ईमेल अभी कन्फर्म नहीं हुआ है। ईमेल में आया कोड डालिए, या नया कोड मँगवाइए।');}else say(authMsg(r.error));}else{location.hash='#dashboard';route();}}).catch(function(x){done(b);say(authMsg(x));});
    }else{
      sb.auth.signUp({email:e,password:p,options:{data:{name:n},emailRedirectTo:location.origin+location.pathname}}).then(function(r){
        done(b);
        if(r.error){say(authMsg(r.error));return;}
        if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0){say('यह ईमेल पहले से रजिस्टर है। कृपया Login करें।');return;}
        if(r.data&&r.data.session){location.hash='#dashboard';route();}
        else{setMode('vf');say('खाता बन गया। ईमेल में आया कोड नीचे डालिए। (कोड न दिखे तो स्पैम देखिए, या थोड़ी देर बाद नया कोड मँगवाइए। अगर ईमेल में कोड की जगह लिंक है, तो उसे खोलकर Login कीजिए।)',true);cool(60);}
      }).catch(function(x){done(b);say(authMsg(x));});
    }
  };
  
},

    $('rmode').innerHTML=h;nstat();

        $('rl').innerHTML=rows.map(srow).join('');

  function clear(){
    edit=null;['rn','rs','ro','r1','r2'].forEach(function(i){$(i).value='';});

  $('rb').onclick=async function(){
    var n=$('rn').value.trim(),a=$('r1').value,b=$('r2').value,rr=$('rr').value,dd=$('rd').value;
    if(!n){say('काम का नाम लिखें।');return;}
    if(!dd){say('तारीख चुनें।');return;}
    if(a&&b&&b<=a){say('खत्म होने का समय, शुरू होने के समय के बाद का होना चाहिए।');return;}
    var rem=$('rm2').value===''?null:+$('rm2').value;

    var err=await rSave({name:n,subject:$('rs').value.trim()||null,start_date:dd,start_time:a||null,end_time:b||null,recurrence:rr,weekdays:wd,remind_min:rem,notes:$('ro').value.trim()||null},edit);
    if(err){say(/weekdays|remind_min/.test(err)?'डेटाबेस अपडेट बाकी है: supabase-routine-upgrade.sql चलाएँ।':err);return;}
    say(edit?'बदलाव सेव हो गया ✓':'Routine सेव हो गया ✓');clear();banner();draw();
  };
  $('rc').onclick=function(){clear();say('');};
  $('rd').onchange=wdText;$('rr').onchange=vis;$('rv').onchange=draw;

      $('rr').value=r.recurrence;$('rm2').value=r.remind_min==null?'':String(r.remind_min);$('ro').value=r.notes||'';

    }

      armed=null;var err=await rDel(rm);
      if(err)say(err);else{say('हटा दिया गया।');banner();draw();}
    }
  };
  $('rl').onchange=async function(e){
    var id=e.target.getAttribute('data-dn');if(!id)return;
    var err=await rToggle(id,e.target.getAttribute('data-day')||today,e.target.checked);

time:function(){
  startClock();
  var ss=$('ss'),sl=$('sl'),armed=0,s0=ST(),blank={status:'idle',acc:0,at:0,t0:0,subj:'',title:''};
  if(s0.subj)ss.value=s0.subj;
  sl.value=s0.title||'';
  $('gl').value=get('goal',120);
  function msg(t){$('sm').textContent=t;}
  function paint(){
    if(!$('sd'))return;
    var x=ST(),td=istDay(Date.now()),tot=0,g=Math.max(10,+get('goal',120)||120)*60000;
    $('sd').textContent=hms(el(x));
    $('sa').textContent=x.status==='running'?'Pause':(x.status==='paused'?'Resume':'Start');
    $('sf').disabled=$('sr').disabled=x.status==='idle';
    arr('sess').forEach(function(r){if(r.date===td)tot+=r.dur;});
    if(x.status!=='idle'&&istDay(x.t0)===td)tot+=el(x);
    $('td').textContent=dur(tot);
    $('tg').textContent=Math.min(100,Math.round(tot/g*100))+'% of daily goal';
    $('tp').style.width=Math.min(100,tot/g*100)+'%';
  }
  function drawHist(){
    var all=arr('sess'),days={},a=[],i,k;
    all.forEach(function(r){days[r.date]=(days[r.date]||0)+r.dur;});
    for(i=6;i>=0;i--){k=istDay(Date.now()-i*864e5);a.push([k,days[k]||0]);}
    var mx=Math.max.apply(null,a.map(function(r){return r[1];}).concat([60000]));
    $('wk').innerHTML=a.map(function(r){return '<div title="'+dur(r[1])+'"><i style="height:'+Math.round(r[1]/mx*60)+'px"></i>'+r[0].slice(8)+'</div>';}).join('');
    $('sh').innerHTML=all.length?all.slice(-10).reverse().map(function(r){return '<tr><td>'+esc(r.date)+'</td><td>'+esc(r.subj)+'</td><td>'+esc(r.title||'—')+'</td><td>'+esc(fH.format(r.t0).toUpperCase())+'</td><td>'+esc(fH.format(r.t1).toUpperCase())+'</td><td>'+hms(r.dur)+'</td></tr>';}).join(''):'<tr><td colspan="6">अभी कोई session सेव नहीं है।</td></tr>';
  }
  $('sa').onclick=function(){
    var x=ST(),n=Date.now();
    if(x.status==='idle'){x={status:'running',acc:0,at:n,t0:n,subj:ss.value,title:sl.value.trim()};msg('Timer शुरू हो गया।');}
    else if(x.status==='running'){x.acc=el(x);x.status='paused';x.at=0;msg('Paused. आगे बढ़ने के लिए Resume दबाएँ।');}
    else{x.status='running';x.at=n;msg('Resumed.');}
    put('st',x);paint();
  };
  $('sf').onclick=function(){
    var x=ST(),d=el(x),all=arr('sess');
    if(x.status==='idle')return;
    if(d<1000){msg('सेव करने के लिए कम से कम 1 सेकंड पढ़ाई ज़रूरी है।');return;}
    all.push({date:istDay(x.t0),subj:ss.value||x.subj,title:sl.value.trim()||x.title,t0:x.t0,t1:Date.now(),dur:d});
    put('sess',all.slice(-200));cloudSession(all[all.length-1]);put('st',blank);
    sl.value='';msg('Session सेव हुआ: '+hms(d));paint();drawHist();
  };
  $('sr').onclick=function(){
    var b=$('sr');
    if(!armed){armed=1;b.textContent='Tap again to confirm';setTimeout(function(){armed=0;if($('sr'))$('sr').textContent='Reset';},3000);return;}
    armed=0;b.textContent='Reset';put('st',blank);msg('Timer reset हुआ। कुछ सेव नहीं किया गया।');paint();
  };
  ss.onchange=sl.oninput=function(){var x=ST();x.subj=ss.value;x.title=sl.value.trim();if(x.status!=='idle')put('st',x);};
  $('gl').onchange=function(){var v=Math.max(10,Math.min(1440,+this.value||120));put('goal',v);this.value=v;paint();};
  paint();drawHist();
  timers.push(setInterval(paint,250));
  document.onvisibilitychange=paint;
},
'typing-test':function(){
  var tx=$('tx'),dur0=60000,tgt='',t0=0,end=0,over=false,tm=null;
  function mk(){var a=(TXT[$('tl').value]||TXT.hi).slice(),o='';while(o.length<5200){a.sort(function(){return Math.random()-.5;});o+=a.join(' ')+' ';}return o.trim();}
  function paint(){
    var v=tx.value,s=Math.max(0,v.length-40),e=Math.min(tgt.length,s+260),h='',i,c;
    for(i=s;i<e;i++){c=esc(tgt[i]);h+=i<v.length?'<span class="'+(v[i]===tgt[i]?'ok':'bad')+'">'+c+'</span>':(i===v.length?'<span class="cur">'+c+'</span>':c);}
    $('tp2').innerHTML=h;
  }
  function left(){return t0?Math.max(0,end-Date.now()):dur0;}
  function show(){var l=Math.ceil(left()/1000);$('tc').textContent=p2(Math.floor(l/60))+':'+p2(l%60);}
  function hist(){
    var a=arr('tests').slice(-5).reverse();
    $('th').innerHTML=a.length?'<div style="overflow-x:auto"><table class="rec" style="min-width:480px"><thead><tr><th>Date</th><th>Time</th><th>Language</th><th>WPM</th><th>Accuracy</th><th>Errors</th></tr></thead><tbody>'+a.map(function(r){return '<tr><td>'+esc(r.d)+'</td><td>'+r.m+' min</td><td>'+(r.l==='hi'?'हिंदी':'English')+'</td><td>'+r.wpm+'</td><td>'+r.acc+'%</td><td>'+r.err+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="msg">अभी कोई टेस्ट नहीं हुआ।</p>';
  }
  function fin(){
    if(over)return;
    over=true;clearInterval(tm);tx.disabled=true;
    var v=tx.value,ok=0,i,lang=$('tl').value;
    for(i=0;i<v.length;i++)if(v[i]===tgt[i])ok++;
    var mins=dur0/60000,wpm=Math.round(ok/5/mins),acc=v.length?Math.round(ok/v.length*100):0,err=v.length-ok;
    $('tc').textContent='00:00';
    $('trs').innerHTML='<h3 style="margin-top:14px">Result</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">'+[['WPM',wpm],['Accuracy',acc+'%'],['Errors',err],['Characters',v.length]].map(function(c){return '<div class="card" style="text-align:center"><div class="big" style="font-size:2rem">'+c[1]+'</div><p>'+c[0]+'</p></div>';}).join('')+'</div><p class="msg">Errors = वे characters जो आख़िर में गलत रह गए।</p>';
    var h=arr('tests');h.push({d:istDay(Date.now()),m:mins,l:lang,wpm:wpm,acc:acc,err:err});put('tests',h.slice(-20));cloudTyping(mins,lang,wpm,acc,err);
    var b=get('best-'+lang,null);if(!b||wpm>b.wpm)put('best-'+lang,{wpm:wpm,acc:acc});
    hist();

  function dn(iso){var a=iso.split('-');return Date.UTC(+a[0],+a[1]-1,+a[2])/864e5;}
  function pad(n){return n<10?'0'+n:''+n;}
  function todayISO(){                                  /* today in India, whatever the device's own time zone */
    var d=new Date(Date.now()+19800000);
    return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
  }
  function at(iso){
    var n=dn(iso),y=+iso.slice(0,4),out=[],yy,id,r,i,f;
    for(yy=y-1;yy<=y+1;yy++){
      if(CAL[yy])for(id in CAL[yy]){r=CAL[yy][id];if(D[id]&&n>=dn(r[0])&&n<=dn(r[1]||r[0]))out.push({d:D[id],s:r[0],e:r[1]||r[0]});}
      for(i=0;i<FIXED.length;i++){
        f=FIXED[i];
        var s=Date.UTC(yy,f[1]-1,f[2])/864e5,e=Date.UTC(f[3]<f[1]?yy+1:yy,f[3]-1,f[4])/864e5;
        if(D[f[0]]&&n>=s&&n<=e)out.push({d:D[f[0]],s:s,e:e});
      }
    }
    out.sort(function(a,b){return b.d.p-a.d.p;});
    var seen={},res=[];
    out.forEach(function(o){if(!seen[o.d.id]){seen[o.d.id]=1;res.push(o.d);}});
    return res;
  }
  function current(){return at(todayISO());}
  function key(){return todayISO()+'|'+current().map(function(f){return f.id;}).join(',');}
