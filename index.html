typing:function(){
  var lang='hi',tgt='',t0=0,done=false,ta=$('ta');
  function best(){var b=get('best-'+lang,null);$('best').innerHTML=b?'Best: <b>'+b.wpm+'</b> WPM':'';}
  function paint(){
    var v=ta.value,h='';
    for(var i=0;i<tgt.length;i++){var c=esc(tgt[i]);h+=i<v.length?'<span class="'+(v[i]===tgt[i]?'ok':'bad')+'">'+c+'</span>':(i===v.length?'<span class="cur">'+c+'</span>':c);}
    $('sample').innerHTML=h;
  }
  function newT(){var a=TXT[lang];tgt=a[Math.floor(Math.random()*a.length)];ta.value='';ta.disabled=false;t0=0;done=false;$('wpm').textContent='0';$('acc').textContent='100';paint();best();ta.placeholder=lang==='hi'?'यहाँ टाइप करना शुरू करें…':'Start typing here…';}
  ta.addEventListener('paste',function(e){e.preventDefault();});
  ta.addEventListener('input',function(){
    if(done)return;
    if(!t0)t0=Date.now();
    var v=ta.value,ok=0;
    for(var i=0;i<v.length;i++)if(v[i]===tgt[i])ok++;
    var m=Math.max((Date.now()-t0)/60000,1/600);
    $('wpm').textContent=Math.round(ok/5/m);
    $('acc').textContent=v.length?Math.round(ok/v.length*100):100;
    paint();
    if(v.length>=tgt.length){
      done=true;ta.disabled=true;
      var r={wpm:Math.round(ok/5/m),acc:Math.round(ok/v.length*100)},b=get('best-'+lang,null);
      if(!b||r.wpm>b.wpm)put('best-'+lang,r);
      best();
    }
  });
  function setL(l){lang=l;$('lhi').setAttribute('aria-pressed',l==='hi');$('len').setAttribute('aria-pressed',l==='en');newT();}
  $('lhi').onclick=function(){setL('hi');};$('len').onclick=function(){setL('en');};$('nw').onclick=newT;
  newT();
},

      sb.auth.updateUser({password:p}).then(function(r){done(b);if(r.error){say(authMsg(r.error));return;}recov=false;location.hash='#dashboard';route();}).catch(function(e){done(b);say(authMsg(e));});
    };
    return;
  }
  if($('lo')){$('lo').onclick=manualLogout;return;}
  var sg=$('sg');
  var rsT=null;
  function cool(sec){
    var rb=$('rs');if(!rb)return;
    var left=sec;rb.disabled=true;rb.textContent='दोबारा भेजें ('+left+' s)';
    if(rsT)clearInterval(rsT);
    rsT=setInterval(function(){
      var x=$('rs');if(!x){clearInterval(rsT);return;}
      left--;
      if(left<=0){clearInterval(rsT);x.disabled=false;x.textContent='कोड दोबारा भेजें';}
      else x.textContent='दोबारा भेजें ('+left+' s)';
    },1000);
    timers.push(rsT);
  }
  function setMode(m){
    mode=m;
    Array.prototype.forEach.call(sg.children,function(x){x.setAttribute('aria-pressed',x.getAttribute('data-m')===m);});
    $('nmw').hidden=m!=='up';$('pww').hidden=(m==='fp'||m==='vf');$('cdw').hidden=m!=='vf';$('rsw').hidden=m!=='vf';
    $('ap').setAttribute('autocomplete',m==='up'?'new-password':'current-password');
    $('ab').textContent=m==='in'?'Login':(m==='up'?'खाता बनाएँ':(m==='vf'?'कोड जाँचें':'रीसेट लिंक भेजें'));
    say('');
  }
  $('rs').onclick=function(){
    var e=$('ae').value.trim(),b=$('rs');
    if(e.indexOf('@')<1){say('कृपया ऊपर सही ईमेल लिखें।');return;}
    b.disabled=true;
    sb.auth.resend({type:'signup',email:e,options:{emailRedirectTo:location.origin+location.pathname}}).then(function(r){
      if(r.error){b.disabled=false;say(authMsg(r.error));return;}
      say('नया कोड भेज दिया गया है। कृपया इनबॉक्स और स्पैम देखें।',true);cool(60);
    }).catch(function(x){b.disabled=false;say(authMsg(x));});
  };
  Array.prototype.forEach.call(sg.children,function(b){b.onclick=function(){setMode(b.getAttribute('data-m'));};});
  if(loginNote){say(loginNote);loginNote='';}
  try{var nt=parseInt(localStorage.getItem(NK),10);if(nt>0){localStorage.removeItem(NK);if(Date.now()-nt<1800000)say('10 मिनट निष्क्रिय रहने के कारण आपको Logout कर दिया गया। कृपया फिर से Login करें।');}}catch(e){}
  ['an','ae','ap','ac'].forEach(function(id){$(id).onkeydown=function(ev){if(ev.key==='Enter')$('ab').click();};});
  if(init==='up'||init==='fp')setMode(init);
  $('ab').onclick=function(){
    var b=$('ab'),e=$('ae').value.trim(),p=$('ap').value,n=$('an').value.trim();
    if(e.indexOf('@')<1){say('कृपया सही ईमेल लिखें।');return;}
    if(mode==='fp'){
      b.disabled=true;
      sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname}).then(function(r){done(b);if(r.error)say(authMsg(r.error));else say('अगर इस ईमेल से खाता है, तो पासवर्ड रीसेट का लिंक भेज दिया गया है। इनबॉक्स और स्पैम फ़ोल्डर देखें।',true);}).catch(function(x){done(b);say(authMsg(x));});
      return;
    }
    if(mode==='vf'){
      var cd=$('ac').value.replace(/\s+/g,'');
      if(!/^\d{6,10}$/.test(cd)){say('कृपया ईमेल में आया कोड (सिर्फ़ अंक) डालिए।');return;}
      b.disabled=true;
      sb.auth.verifyOtp({email:e,token:cd,type:'signup'}).then(function(r){
        done(b);
        if(r.error){say(authMsg(r.error));return;}
        say('ईमेल सत्यापित हो गया। आपको Dashboard पर ले जा रहे हैं…',true);
        location.hash='#dashboard';route();
      }).catch(function(x){done(b);say(authMsg(x));});
      return;
    }
    if(mode==='up'&&n.length<1){say('कृपया अपना नाम लिखें।');return;}
    if(p.length<8){say('पासवर्ड कम से कम 8 अक्षर का होना चाहिए।');return;}
    b.disabled=true;
    if(mode==='in'){
      sb.auth.signInWithPassword({email:e,password:p}).then(function(r){done(b);if(r.error){if(r.error.code==='email_not_confirmed'||/email not confirmed/i.test(r.error.message||'')){setMode('vf');say('आपका ईमेल अभी कन्फर्म नहीं हुआ है। ईमेल में आया कोड डालिए, या नया कोड मँगवाइए।');}else say(authMsg(r.error));}else{location.hash='#dashboard';route();}}).catch(function(x){done(b);say(authMsg(x));});
    }else{
      sb.auth.signUp({email:e,password:p,options:{data:{name:n},emailRedirectTo:location.origin+location.pathname}}).then(function(r){
        done(b);
        if(r.error){say(authMsg(r.error));return;}
        if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0){say('यह ईमेल पहले से रजिस्टर है। कृपया Login करें।');return;}
        if(r.data&&r.data.session){location.hash='#dashboard';route();}
        else{setMode('vf');say('खाता बन गया। ईमेल में आया कोड नीचे डालिए। (कोड न दिखे तो स्पैम देखिए, या थोड़ी देर बाद नया कोड मँगवाइए। अगर ईमेल में कोड की जगह लिंक है, तो उसे खोलकर Login कीजिए।)',true);cool(60);}
      }).catch(function(x){done(b);say(authMsg(x));});
    }
  };
  
},

routine:function(){

    h+='<p class="msg">🔔 रिमाइंडर तभी आएँगे जब वेबसाइट किसी टैब में खुली हो। साइट बंद होने पर या इंटरनेट/फ़ोन बंद होने पर रिमाइंडर नहीं आएगा।</p><p><button class="btn alt" id="nb" style="color:var(--ink)">🔔 नोटिफ़िकेशन चालू करें</button> <span class="msg" id="ns"></span></p>';
    $('rmode').innerHTML=h;nstat();
    $('nb').onclick=function(){var N=window.Notification;if(!N){nstat();return;}try{var p=N.requestPermission(nstat);if(p&&p.then)p.then(nstat);}catch(e){nstat();}};

  async function importLocal(){

  async function draw(){

        $('rl').innerHTML=rows.map(function(r){return rrow(r,false,true);}).join('');
      }else{
        rows=await rList();$('rp').style.width='0';
        $('rt').textContent=rows.length?'कुल '+rows.length+' Routine।':'अभी कोई Routine नहीं बना है। ऊपर से पहला जोड़ें।';
        $('rl').innerHTML=rows.map(srow).join('');
      }
    }catch(e){$('rl').textContent='लोड नहीं हो सका: '+e.message;}

  function clear(){
    edit=null;['rn','rs','ro','r1','r2'].forEach(function(i){$(i).value='';});
    $('rr').value='none';$('rm2').value='';$('rd').value=today;
    [].forEach.call($('rw').querySelectorAll('input'),function(x){x.checked=false;});
    $('rh').textContent='नया काम जोड़ें';$('rb').textContent='सेव करें';$('rc').hidden=true;vis();wdText();
  }
  $('rb').onclick=async function(){
    var n=$('rn').value.trim(),a=$('r1').value,b=$('r2').value,rr=$('rr').value,dd=$('rd').value;
    if(!n){say('काम का नाम लिखें।');return;}
    if(!dd){say('तारीख चुनें।');return;}
    if(a&&b&&b<=a){say('खत्म होने का समय, शुरू होने के समय के बाद का होना चाहिए।');return;}
    var rem=$('rm2').value===''?null:+$('rm2').value;
    if(rem!==null&&!a){say('याद दिलाने के लिए शुरू होने का समय चुनें।');return;}
    var wd=null;
    if(rr==='weekly'){wd=[].filter.call($('rw').querySelectorAll('input'),function(x){return x.checked;}).map(function(x){return +x.value;});if(!wd.length)wd=[wdOf(dd)];}
    var err=await rSave({name:n,subject:$('rs').value.trim()||null,start_date:dd,start_time:a||null,end_time:b||null,recurrence:rr,weekdays:wd,remind_min:rem,notes:$('ro').value.trim()||null},edit);
    if(err){say(/weekdays|remind_min/.test(err)?'डेटाबेस अपडेट बाकी है: supabase-routine-upgrade.sql चलाएँ।':err);return;}
    say(edit?'बदलाव सेव हो गया ✓':'Routine सेव हो गया ✓');clear();banner();draw();
  };
  $('rc').onclick=function(){clear();say('');};
  $('rd').onchange=wdText;$('rr').onchange=vis;$('rv').onchange=draw;
  $('rtabs').onclick=function(e){
    var t=e.target.getAttribute('data-t');if(!t)return;
    tab=t;[].forEach.call($('rtabs').children,function(x){x.setAttribute('aria-pressed',x===e.target);});vis();draw();
  };
  $('rl').onclick=async function(e){
    var t=e.target,ed=t.getAttribute('data-ed'),rm=t.getAttribute('data-rm');
    if(ed){
      var r=rows.filter(function(x){return x.id===ed;})[0];if(!r)return;
      edit=r;$('rn').value=r.name;$('rs').value=r.subject||'';$('rd').value=r.start_date;$('r1').value=hm(r.start_time);$('r2').value=hm(r.end_time);
      $('rr').value=r.recurrence;$('rm2').value=r.remind_min==null?'':String(r.remind_min);$('ro').value=r.notes||'';
      [].forEach.call($('rw').querySelectorAll('input'),function(x){x.checked=!!(r.weekdays&&r.weekdays.indexOf(+x.value)>=0);});
      $('rh').textContent='काम बदलें (दोहराने वाले काम में पूरी सीरीज़ बदलती है)';$('rb').textContent='बदलाव सेव करें';$('rc').hidden=false;vis();wdText();window.scrollTo(0,0);
    }
    if(rm){
      if(armed!==rm){armed=rm;t.textContent='पक्का?';return;}
      armed=null;var err=await rDel(rm);
      if(err)say(err);else{say('हटा दिया गया।');banner();draw();}
    }
  };
  $('rl').onchange=async function(e){
    var id=e.target.getAttribute('data-dn');if(!id)return;
    var err=await rToggle(id,e.target.getAttribute('data-day')||today,e.target.checked);
    if(err)say(err);draw();
  };
  banner();vis();wdText();draw();
},
time:function(){
  startClock();
  var ss=$('ss'),sl=$('sl'),armed=0,s0=ST(),blank={status:'idle',acc:0,at:0,t0:0,subj:'',title:''};
  if(s0.subj)ss.value=s0.subj;
  sl.value=s0.title||'';
  $('gl').value=get('goal',120);
  function msg(t){$('sm').textContent=t;}
  function paint(){
    if(!$('sd'))return;
    var x=ST(),td=istDay(Date.now()),tot=0,g=Math.max(10,+get('goal',120)||120)*60000;
    $('sd').textContent=hms(el(x));
    $('sa').textContent=x.status==='running'?'Pause':(x.status==='paused'?'Resume':'Start');
    $('sf').disabled=$('sr').disabled=x.status==='idle';
    arr('sess').forEach(function(r){if(r.date===td)tot+=r.dur;});
    if(x.status!=='idle'&&istDay(x.t0)===td)tot+=el(x);
    $('td').textContent=dur(tot);
    $('tg').textContent=Math.min(100,Math.round(tot/g*100))+'% of daily goal';
    $('tp').style.width=Math.min(100,tot/g*100)+'%';
  }
  function drawHist(){
    var all=arr('sess'),days={},a=[],i,k;
    all.forEach(function(r){days[r.date]=(days[r.date]||0)+r.dur;});
    for(i=6;i>=0;i--){k=istDay(Date.now()-i*864e5);a.push([k,days[k]||0]);}
    var mx=Math.max.apply(null,a.map(function(r){return r[1];}).concat([60000]));
    $('wk').innerHTML=a.map(function(r){return '<div title="'+dur(r[1])+'"><i style="height:'+Math.round(r[1]/mx*60)+'px"></i>'+r[0].slice(8)+'</div>';}).join('');
    $('sh').innerHTML=all.length?all.slice(-10).reverse().map(function(r){return '<tr><td>'+esc(r.date)+'</td><td>'+esc(r.subj)+'</td><td>'+esc(r.title||'—')+'</td><td>'+esc(fH.format(r.t0).toUpperCase())+'</td><td>'+esc(fH.format(r.t1).toUpperCase())+'</td><td>'+hms(r.dur)+'</td></tr>';}).join(''):'<tr><td colspan="6">अभी कोई session सेव नहीं है।</td></tr>';
  }
  $('sa').onclick=function(){
    var x=ST(),n=Date.now();
    if(x.status==='idle'){x={status:'running',acc:0,at:n,t0:n,subj:ss.value,title:sl.value.trim()};msg('Timer शुरू हो गया।');}
    else if(x.status==='running'){x.acc=el(x);x.status='paused';x.at=0;msg('Paused. आगे बढ़ने के लिए Resume दबाएँ।');}
    else{x.status='running';x.at=n;msg('Resumed.');}
    put('st',x);paint();
  };
  $('sf').onclick=function(){
    var x=ST(),d=el(x),all=arr('sess');
    if(x.status==='idle')return;
    if(d<1000){msg('सेव करने के लिए कम से कम 1 सेकंड पढ़ाई ज़रूरी है।');return;}
    all.push({date:istDay(x.t0),subj:ss.value||x.subj,title:sl.value.trim()||x.title,t0:x.t0,t1:Date.now(),dur:d});
    put('sess',all.slice(-200));cloudSession(all[all.length-1]);put('st',blank);
    sl.value='';msg('Session सेव हुआ: '+hms(d));paint();drawHist();
  };
  $('sr').onclick=function(){
    var b=$('sr');
    if(!armed){armed=1;b.textContent='Tap again to confirm';setTimeout(function(){armed=0;if($('sr'))$('sr').textContent='Reset';},3000);return;}
    armed=0;b.textContent='Reset';put('st',blank);msg('Timer reset हुआ। कुछ सेव नहीं किया गया।');paint();
  };
  ss.onchange=sl.oninput=function(){var x=ST();x.subj=ss.value;x.title=sl.value.trim();if(x.status!=='idle')put('st',x);};
  $('gl').onchange=function(){var v=Math.max(10,Math.min(1440,+this.value||120));put('goal',v);this.value=v;paint();};
  paint();drawHist();
  timers.push(setInterval(paint,250));
  document.onvisibilitychange=paint;
},
'typing-test':function(){
  var tx=$('tx'),dur0=60000,tgt='',t0=0,end=0,over=false,tm=null;
  function mk(){var a=(TXT[$('tl').value]||TXT.hi).slice(),o='';while(o.length<5200){a.sort(function(){return Math.random()-.5;});o+=a.join(' ')+' ';}return o.trim();}
  function paint(){
    var v=tx.value,s=Math.max(0,v.length-40),e=Math.min(tgt.length,s+260),h='',i,c;
    for(i=s;i<e;i++){c=esc(tgt[i]);h+=i<v.length?'<span class="'+(v[i]===tgt[i]?'ok':'bad')+'">'+c+'</span>':(i===v.length?'<span class="cur">'+c+'</span>':c);}
    $('tp2').innerHTML=h;
  }
  function left(){return t0?Math.max(0,end-Date.now()):dur0;}
  function show(){var l=Math.ceil(left()/1000);$('tc').textContent=p2(Math.floor(l/60))+':'+p2(l%60);}
  function hist(){
    var a=arr('tests').slice(-5).reverse();
    $('th').innerHTML=a.length?'<div style="overflow-x:auto"><table class="rec" style="min-width:480px"><thead><tr><th>Date</th><th>Time</th><th>Language</th><th>WPM</th><th>Accuracy</th><th>Errors</th></tr></thead><tbody>'+a.map(function(r){return '<tr><td>'+esc(r.d)+'</td><td>'+r.m+' min</td><td>'+(r.l==='hi'?'हिंदी':'English')+'</td><td>'+r.wpm+'</td><td>'+r.acc+'%</td><td>'+r.err+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="msg">अभी कोई टेस्ट नहीं हुआ।</p>';
  }
  function fin(){
    if(over)return;
    over=true;clearInterval(tm);tx.disabled=true;
    var v=tx.value,ok=0,i,lang=$('tl').value;
    for(i=0;i<v.length;i++)if(v[i]===tgt[i])ok++;
    var mins=dur0/60000,wpm=Math.round(ok/5/mins),acc=v.length?Math.round(ok/v.length*100):0,err=v.length-ok;
    $('tc').textContent='00:00';
    $('trs').innerHTML='<h3 style="margin-top:14px">Result</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">'+[['WPM',wpm],['Accuracy',acc+'%'],['Errors',err],['Characters',v.length]].map(function(c){return '<div class="card" style="text-align:center"><div class="big" style="font-size:2rem">'+c[1]+'</div><p>'+c[0]+'</p></div>';}).join('')+'</div><p class="msg">Errors = वे characters जो आख़िर में गलत रह गए।</p>';
    var h=arr('tests');h.push({d:istDay(Date.now()),m:mins,l:lang,wpm:wpm,acc:acc,err:err});put('tests',h.slice(-20));cloudTyping(mins,lang,wpm,acc,err);
    var b=get('best-'+lang,null);if(!b||wpm>b.wpm)put('best-'+lang,{wpm:wpm,acc:acc});
    hist();
  }
  function reset(){
    clearInterval(tm);over=false;t0=0;end=0;dur0=(+$('tt').value||1)*60000;
    tgt=mk();tx.value='';tx.disabled=false;$('trs').innerHTML='';show();paint();tx.focus();
  }
  tx.addEventListener('paste',function(e){e.preventDefault();});
  tx.addEventListener('input',function(){
    if(over)return;
    if(!t0){t0=Date.now();end=t0+dur0;tm=setInterval(function(){show();if(left()<=0)fin();},200);timers.push(tm);}
    if(Date.now()>=end){fin();return;}
    paint();
  });
  $('tt').onchange=$('tl').onchange=$('tr').onclick=reset;
  hist();reset();
},
leaderboard:function(){
  $('nm').oninput=function(){put('name',this.value);};
  var g=$('gb');
  if(!sb){g.textContent='Cloud accounts are not switched on yet.';return;}
  if(!me){g.innerHTML='<a href="#account">Log in</a> to see the global leaderboard and save your results.';return;}
  sb.rpc('get_leaderboard').then(function(r){
    if(!$('gb'))return;
    if(r.error){g.textContent='Could not load the leaderboard.';return;}
    g.innerHTML=r.data.length?'<table><tr><th>#</th><th>Name</th><th>Best score</th><th>Best WPM</th><th>Tests</th></tr>'+r.data.map(function(x,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(x.display_name)+'</td><td>'+x.best_score+'</td><td>'+x.best_wpm+'</td><td>'+x.tests+'</td></tr>';}).join('')+'</table>':'No results yet. Take a timed typing test.';
  });
},
contact:function(){
  $('cs').onclick=function(){
    var n=$('cn').value.trim(),m=$('cm').value.trim(),o=$('cmsg');
    if(!m){o.textContent='पहले संदेश लिखें।';return;}
    if(!EMAIL){o.textContent='संपर्क ईमेल अभी सेट नहीं है।';return;}
    location.href='mailto:'+EMAIL+'?subject='+encodeURIComponent('AK NEST EDU: '+n)+'&body='+encodeURIComponent(m);
  };
}
};

var NG=[[null,['home','dashboard']],['पढ़ाई',['routine','study-room','time']],['अभ्यास',['typing','typing-test','test']],['टूल्स',['planner','notes','career']],['कम्युनिटी',['leaderboard']],['खाता और मदद',['contact','account']]];
function navHTML(id,labelOf,extra){
  var out='',k=0;
  NG.forEach(function(g,gi){
    var items='';
    g[1].forEach(function(pid){
      var lab=labelOf(pid);if(!lab)return;
      var m=lab.match(/^(\S+)\s+(.+)$/),ic=m?m[1]:'🏠',tx=m?m[2]:lab;
      items+='<a href="#'+pid+'"'+(pid===id?' aria-current="page"':'')+'><span class="ni" style="--d:'+((k++)*0.17).toFixed(2)+'s" aria-hidden="true">'+ic+'</span><span>'+tx+'</span></a>';
    });
    if(gi===NG.length-1)items+=extra;
    out+='<div class="ngw'+(gi===NG.length-1?' last':'')+'">'+(g[0]?'<div class="ng">'+g[0]+'</div>':'')+items+'</div>';
  });
  return out;
}
var side=$('side'),scrim=$('scrim'),mbtn=$('mbtn');
function showActive(){
  var nv=$('nav'),a=nv.querySelector('a[aria-current="page"]');if(!a)return;
  var nr=nv.getBoundingClientRect(),ar=a.getBoundingClientRect();if(!nr.height)return;
  if(ar.top<nr.top+40)nv.scrollTop-=(nr.top+40-ar.top);else if(ar.bottom>nr.bottom-8)nv.scrollTop+=(ar.bottom-nr.bottom+8);
  if(a===nv.querySelector('a'))nv.scrollTop=0;
}
function openMenu(){side.classList.add('open');scrim.hidden=false;mbtn.setAttribute('aria-expanded','true');document.documentElement.classList.add('nolock');showActive();var a=side.querySelector('a[aria-current="page"]')||side.querySelector('#nav a');if(a)a.focus();}
function closeMenu(back){
  var was=side.classList.contains('open');
  side.classList.remove('open');scrim.hidden=true;mbtn.setAttribute('aria-expanded','false');document.documentElement.classList.remove('nolock');
  if(was&&back)mbtn.focus();
}
mbtn.onclick=function(){side.classList.contains('open')?closeMenu(true):openMenu();};
$('sclose').onclick=function(){closeMenu(true);};
scrim.onclick=function(){closeMenu(true);};
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&side.classList.contains('open'))closeMenu(true);});
window.addEventListener('resize',function(){if(window.innerWidth>=900)closeMenu(false);});
$('nav').addEventListener('click',function(ev){var a=ev.target.closest&&ev.target.closest('a');if(a)closeMenu(false);});
function failHTML(){
  return '<div class="authbrand"><span class="lg" aria-hidden="true">AK</span><h1>AK NEST EDU</h1><div class="tl">Learn • Grow • Succeed</div><p>Login सेवा अभी लोड नहीं हो सकी।</p></div><div class="card"><p>सुरक्षा (Login) वाली लाइब्रेरी इंटरनेट या ad-blocker की वजह से लोड नहीं हुई। आपके डेटा की सुरक्षा के लिए पूरी साइट अभी बंद रखी गई है। कृपया इंटरनेट जाँचें, ad-blocker बंद करें और दोबारा कोशिश करें।</p><p><button class="btn" id="retry" type="button">दोबारा कोशिश करें</button></p></div>';
}
function route(){
  clearT();RC=null;
  if(LIBFAIL){document.body.classList.add('authonly');closeMenu(false);$('nav').innerHTML='';app.innerHTML=failHTML();var rb=$('retry');if(rb)rb.onclick=function(){location.reload();};return;}
  var id=location.hash.slice(1),init='';
  if(id==='logout'){if(sb&&me){manualLogout();}else if(sb){location.replace(LOGIN_URL);}else location.hash='#home';return;}
  if(sb){
    document.body.classList.toggle('authonly',!me);
    if(!authReady){closeMenu(false);$('nav').innerHTML='';app.innerHTML='<div class="authbrand"><span class="lg" aria-hidden="true">AK</span><h1>AK NEST EDU</h1><div class="tl">Learn • Grow • Succeed</div><p>कृपया प्रतीक्षा करें…</p></div>';return;}
    if(!me){
      if(id!=='login'&&id!=='signup'&&id!=='forgot'){
        if(/(^|&)error(_code|_description)?=/.test(id))loginNote='यह लिंक पुराना हो गया है या सही नहीं है। कृपया Login करें, या नया कोड/लिंक मँगवाइए।';
        location.replace(LOGIN_URL);return;
      }
      closeMenu(false);$('nav').innerHTML='';
      app.innerHTML='<div class="authbrand"><span class="lg" aria-hidden="true">AK</span><h1>AK NEST EDU</h1><div class="tl">Learn • Grow • Succeed</div><p>जारी रखने के लिए Login करें या नया खाता बनाएँ।</p></div>'+V.account();
      I.account(id==='signup'?'up':(id==='forgot'?'fp':'in'));
      window.scrollTo(0,0);return;
    }
    if(!recov&&(id==='login'||id==='signup'||id==='forgot'||/(^|&)(access_token|type|error)=/.test(id))){location.replace(location.pathname+location.search+'#dashboard');return;}
  }
  if(id==='login'||id==='signup'||id==='forgot'){init=id==='signup'?'up':(id==='forgot'?'fp':'in');id='account';}
  if(!V[id])id='home';
  var gated=(id==='dashboard'&&sb&&!me);
  var PM={};PAGES.forEach(function(p){PM[p[0]]=p[1];});
  $('nav').innerHTML=navHTML(id,function(pid){
    var lab=PM[pid];
    if(pid==='account'&&sb&&lab)lab=me?'👤 मेरा खाता':'🔐 Login / Sign up';
    return lab;
  },(sb&&me?'<a href="#logout"><span class="ni" aria-hidden="true">🚪</span><span>Logout</span></a>':''));
  closeMenu(false);showActive();
  app.innerHTML=gated?gate('📊 मेरा Dashboard'):V[id]();
  if(!gated&&I[id])I[id](init);
  window.scrollTo(0,0);
}

window.addEventListener('hashchange',route);
route();
startRem();
